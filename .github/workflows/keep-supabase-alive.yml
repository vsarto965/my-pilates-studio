name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://bafzunxfadlonaegvxfl.supabase.co/rest/v1/admin?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
